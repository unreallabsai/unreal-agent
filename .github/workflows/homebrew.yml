name: Publish Homebrew

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  release:
    types: [published]

permissions: {}

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'unreallabsai/unreal-agent' && !github.event.release.prerelease
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("expected a published stable release") else . end'
          # Only the latest stable release may update the tap.
          latest_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          [[ "$RELEASE_TAG" == "$latest_tag" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: unreallabsai/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Download and verify release archives; update formulae
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.tar.gz' --pattern SHA256SUMS
          bash scripts/update-homebrew.sh "$RELEASE_TAG" dist homebrew-tap
          ruby -c homebrew-tap/Formula/unreal-agent.rb
          ruby -c homebrew-tap/Formula/unreal-agent-runner.rb
      - name: Publish tap update
        working-directory: homebrew-tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula Aliases
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Publish unreal-agent $RELEASE_TAG"
            git push origin HEAD:main
          fi
